            "交替用于预判同级相似波浪会以不同方式展开；调整深度用于估计价格区域，两者都是指南。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [],
          "paragraphs": [
            "交替和前一小一级第四浪区域都不是硬性失效条件。"
          ],
          "title": "强制规则"
        },
        {
          "items": [
            "浪2陡直时浪4常横向，反之亦然。",
            "浪2与浪4常在简单/复杂、是否制造新极端方面交替。",
            "调整尤其是第四浪常在前一小一级第四浪区域内结束。"
          ],
          "paragraphs": [],
          "title": "指南"
        },
        {
          "items": [
            "描述浪2的风格和复杂度。",
            "为浪4列出不同风格的优先候选。",
            "标出前一小一级第四浪区域作为目标带。",
            "结合调整类型和延长浪修正预期。"
          ],
          "paragraphs": [],
          "title": "识别与检查步骤"
        },
        {
          "items": [],
          "paragraphs": [

          ],
          "title": "确认条件"
        },
        {
          "items": [],
          "paragraphs": [
            "仅因没有交替或没有到达目标区域就否定一个满足硬规则的结构。"
          ],
          "title": "失效条件"
        },
        {
          "items": [
            "把交替当成每次必然发生。",
            "忽略斜纹浪的浪2和浪4通常都为锯齿。",
            "把目标区域当精确点位。"
          ],
          "paragraphs": [],
          "title": "常见错误"
        },
        {
          "items": [],
          "paragraphs": [
            "平台、三角和联合多属横向风格；锯齿和多重锯齿多属陡直风格。"

      "sections": [
        {
          "items": [],
          "paragraphs": [
            "本分支只保存已经回到《艾略特波浪理论：市场行为的关键（原书第11版）》核验过的规则、指南和方法。规则用于淘汰不可能结构；指南用于排序仍然有效的候选方案。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [
            "先检查结构硬规则，再讨论比例、通道、成交量和波浪个性。",
            "违反规则时，只否定规则所约束的候选浪形，不自动否定所有市场方向判断。"
          ],
          "paragraphs": [],
          "title": "强制规则"
        },
        {
          "items": [],
          "paragraphs": [
            "满足更多相互独立指南的候选方案通常更典型，但指南不满足不能单独判死刑。"
          ],
          "title": "指南"
        },
        {
          "items": [
            "明确市场、周期和候选浪级。",
            "同时列出首选与备选数浪。",
            "对每个方案依次检查规则、结构、比例、通道、成交量和个性。",
            "写明确认条件、失效条件和下一观察点。"
          ],
          "paragraphs": [],
          "title": "识别与检查步骤"
        },
        {
          "items": [],
          "paragraphs": [
            "候选方案没有违反适用硬规则，并获得内部结构和多个指南的交叉支持。"
          ],
          "title": "确认条件"
        },
        {
          "items": [],
          "paragraphs": [
            "市场运动超出候选形态的原书允许范围，或内部结构与所标浪形不相容。"
          ],
          "title": "失效条件"
        },
        {
          "items": [
            "把指南写成必须满足的规则。",
            "只给一个数浪，不保留备选。",
            "用单一比例或单一指标代替结构检查。"
          ],
          "paragraphs": [],
          "title": "常见错误"
        },
        {
          "items": [],
          "paragraphs": [
            "通过下级分支进入基本结构、驱动浪、调整浪、构造指南和实际应用。"
          ],
          "title": "相关浪形与备选解释"
        },
        {
          "items": [
            "第一章“基本原则”与“详细分析”，书页6–45，PDF页33–72。",
            "第二章“波浪构造准则”，书页53–98，PDF页80–125。"
          ],
          "paragraphs": [],
          "title": "原书来源"
        }
      ],

      "sections": [
        {
          "items": [],
          "paragraphs": [
            "驱动与调整描述的是波浪形成方式，不等于绝对上涨或下跌。与大一级趋势同向的作用浪通常按五浪驱动方式展开；逆向的反作用浪通常按三浪或三浪变体展开。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [
            "完整驱动浪采用五浪结构。",
            "完整调整浪不能以一个独立五浪结束；逆大一级趋势出现的最初五浪只能是更大调整的一部分。"
          ],
          "paragraphs": [],
          "title": "强制规则"
        },
        {
          "items": [],
          "paragraphs": [
            "先判相对方向，再判五浪或三浪。方向、功能和形成方式不能只凭肉眼涨跌混为一谈。"
          ],
          "title": "指南"
        },
        {
          "items": [
            "选定一个大一级结构作为参照。",
            "标明当前浪与大一级趋势同向还是逆向。",
            "检查内部是五浪、三浪还是三浪变体。",
            "如果逆向运动走出五浪，继续寻找B、C或更大的调整组合。"
          ],
          "paragraphs": [],
          "title": "识别与检查步骤"
        },
        {
          "items": [],
          "paragraphs": [
            "波浪的内部结构、相对方向及其在大一级模式中的位置相互一致。"
          ],
          "title": "确认条件"
        },
        {
          "items": [],
          "paragraphs": [
            "把一个逆大一级趋势的独立五浪直接标成整个调整结束，或者仅凭绝对涨跌方向定义驱动与调整。"
          ],
          "title": "失效条件"
        },
        {
          "items": [
            "上涨就标驱动、下跌就标调整。",
            "忽略浪级参照。",
            "看到五段就结束调整，不等待更大结构。"
          ],
          "paragraphs": [],
          "title": "常见错误"
        },
        {
          "items": [],
          "paragraphs": [
            "五浪候选继续检查推动或斜纹；三浪候选继续检查锯齿、平台、三角或联合。"
          ],
          "title": "相关浪形与备选解释"
        },
        {
          "items": [
            "第一章“波浪形成方式”，书页7–15，PDF页34–42，图1-1至图1-4。",
            "第一章“调整浪”，书页29，PDF页56。"
          ],
          "paragraphs": [],
          "title": "原书来源"
        }
      ],

      "sections": [
        {
          "items": [],
          "paragraphs": [
            "推动浪是最常见的五浪驱动形态，浪1、3、5为驱动分量，浪2、4为调整分量。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [
            "浪2不得运动过浪1起点。",
            "浪3必须运动过浪1终点，而且不得成为浪1、3、5中最短的一浪。",
            "在通常的无杠杆现货市场中，浪4不得进入浪1价格区域。",
            "浪3本身必须是推动浪；浪1与浪5可为推动或允许位置的斜纹。"
          ],
          "paragraphs": [],
          "title": "强制规则"
        },
        {
          "items": [],
          "paragraphs": [
            "浪2多为锯齿类陡直调整，浪4多为平台、三角或横向联合；一个作用浪通常延长。"
          ],
          "title": "指南"
        },
        {
          "items": [
            "标出浪1起点、浪1终点、浪3终点和浪4终点。",
            "逐条检查回撤、推进、最短浪与重叠。",
            "规则通过后再比较浪1、3、5的延长与等同关系。"
          ],
          "paragraphs": [],
          "title": "识别与检查步骤"
        },
        {
          "items": [],
          "paragraphs": [
            "四条核心规则全部成立，内部浪形与推动位置允许范围相容。"
          ],
          "title": "确认条件"
        },
        {
          "items": [],
          "paragraphs": [
            "任一核心规则被明确违反。高杠杆期货的极短周期重叠需结合现货及更高周期复核，不能机械套用。"
          ],
          "title": "失效条件"
        },
        {
          "items": [

      "sections": [
        {
          "items": [],
          "paragraphs": [
            "单锯齿为A-B-C三浪调整，典型内部序列5-3-5。双重、三重锯齿分别用W-X-Y和W-X-Y-X-Z表示，X是调整连接浪。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [
            "A浪必须是推动或引导斜纹，C浪必须是推动或斜纹。",
            "B浪不得运动过A浪起点。",
            "多重锯齿的W、Y、Z各自必须能成立为锯齿，X必须是调整浪。"
          ],
          "paragraphs": [],
          "title": "强制规则"
        },
        {
          "items": [],
          "paragraphs": [
            "C浪通常与A浪等长且常超过A终点；B浪常回撤A浪38%–79%，具体区间随B的形态变化。"
          ],
          "title": "指南"
        },
        {
          "items": [
            "先确认整体ABC或W-X-Y结构。",
            "展开A、C，检查驱动性质。",
            "检查B浪起点失效位。",
            "多重结构分别验证每个锯齿与连接浪。"
          ],
          "paragraphs": [],
          "title": "识别与检查步骤"
        },
        {
          "items": [],
          "paragraphs": [
            "结构规则成立，并得到C=A、B回撤或通道关系之一以上支持。"
          ],
          "title": "确认条件"
        },
        {
          "items": [],
          "paragraphs": [
            "B越过A起点，或A/C缺少允许的驱动结构。"
          ],
          "title": "失效条件"
        },
        {
          "items": [
            "把X当成与W、Y、Z同方向的主调整段。",
            "把“双锯齿Y至少达到W的90%”当作原书硬规则；原书总结没有这条要求。",
            "与横向双重三浪混淆。"
          ],
          "paragraphs": [],
          "title": "常见错误"
        },
        {
          "items": [],
          "paragraphs": [
            "B回撤达到A的90%以上时优先检查平台；结构横向且第一个模式已充分调整价格时检查联合形。"
          ],
          "title": "相关浪形与备选解释"
        },

            "第一章书页29–33，PDF页56–60，图1-22至图1-28。",

          "title": "原书来源"

      "sections": [
        {
          "items": [
            "第一阶段“规则”：按驱动浪、锯齿、平台、联合、三角、买卖点的顺序识别。",
            "第二阶段“翻译”：把“不重叠、三锯齿、最大回撤”等频道表达翻译为波浪规则。",
            "第三阶段“案例”：练习BTC、ETH、小米、A股/科创50与最大回撤案例。",
            "第四阶段“训练”：每张图写主方案、备选方案、确认条件和失效条件。",
            "使用顺序是“先合法，后好看；先结构，后价格；先备选，后仓位”。"
          ],
          "paragraphs": [],
          "title": "原始说法"
        },
        {
          "items": [
            "Word“一、阅读路线”",
            "Word表2：四阶段阅读路线",
            "Word表3：使用顺序",
            "浪仙宗规则子区顺序截图"
          ],
          "paragraphs": [],
          "title": "来源位置"
        },
        {
          "items": [],
          "paragraphs": [
            "已核验为“学习工作流”。这套路线可继续使用，但它不是原书规定的章节顺序或强制分析顺序。"
          ],
          "title": "当前核验状态"
        },
        {
          "items": [
            "先学习驱动浪与调整浪的结构，再把规则用于图表排除。",
            "用多种合法计数处理不确定性，并记录确认与失效条件。",
            "“先合法，后好看”符合原书用规则淘汰计数、再用指南排序的思路。"
          ],
          "paragraphs": [],
          "title": "与原书一致之处"
        },
        {
          "items": [
            "六类规则的学习先后顺序",
            "“翻译”阶段使用的频道术语映射",
            "案例与训练材料的选择和排列"

          "title": "尚未获得原书支持之处"

          "title": "可能存在的冲突"

      "sections": [
        {
          "items": [],
          "paragraphs": [
            "首选数浪是未违反规则且获得最多指南支持的方案；备选是同样未失效、但证据较弱的其他解释。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [],
          "paragraphs": [
            "先排除硬规则不允许的方案。概率排序不能被表述为特定结果的确定性。"
          ],
          "title": "强制规则"
        },
        {
          "items": [],
          "paragraphs": [
            "当两个或三个最佳方案指向相同方向或风险边界时，决策依据更稳健。"
          ],
          "title": "指南"
        },
        {
          "items": [
            "为每个候选建立规则检查表。",
            "删除违反硬规则者。",
            "对剩余方案统计结构、交替、比例、通道、成交量和个性证据。",
            "排出首选、备选和触发切换的条件。"
          ],
          "paragraphs": [],
          "title": "识别与检查步骤"
        },
        {
          "items": [],
          "paragraphs": [
            "首选方案得到多个独立指南支持，且后续价格按预期内部结构演化。"
          ],
          "title": "确认条件"
        },
        {
          "items": [],
          "paragraphs": [
            "市场触发首选的结构失效条件，此时仍有效的备选立即升级。"
          ],
          "title": "失效条件"
        },
        {
          "items": [
            "只保留一个方案。",
            "为保护观点而不断移动失效位。",
            "用指南数量掩盖一条硬规则冲突。"
          ],
          "paragraphs": [],
          "title": "常见错误"
        },
        {
          "items": [],
          "paragraphs": [
            "任何具体浪形页面都可以被本流程调用；流程不预设市场必然方向。"
          ],
          "title": "相关浪形与备选解释"
        },
        {
          "items": [
            "第二章书页91–96，PDF页118–123。"

      "sections": [
        {
          "items": [
            "文档称浪1、浪3内部的浪2/浪4不能大于更大级别的浪2/浪4；浪5内部的5-2/5-4不能大于更大级别浪4。",
            "文档称浪3达到浪1的两倍以上时可按浪3延长处理，此时浪5长度不能超过浪3。",
            "文档称浪5缩短时，浪4要回撤浪3的50%，浪5要回撤浪4的80%。",
            "文档称标准推动中的浪1和浪4不能重叠，楔形中的浪1和浪4必须重叠。",
            "文档称引导楔形内部为53535且不扩散，终结楔形内部为33333且可以扩散。",
            "截图称楔形可出现在浪1或浪5的位置，A浪和C浪同理；出现在浪1称引导楔形，出现在浪5称终结楔形。",
            "截图称楔形也遵守浪3不最短，并称多数楔形的浪5不会成为最长一浪，扩散楔形除外。",
            "文档给出的用法是：遇到浪1/浪4重叠时先检查楔形，不直接作废数浪方案。"
          ],
          "paragraphs": [],
          "title": "原始说法"
        },
        {
          "items": [
            "Word“3.1 驱动浪”",
            "Word表4：驱动浪“知识点、规则、用法”",
            "驱动浪内部回撤截图",
            "引导楔形与终结楔形截图"
          ],
          "paragraphs": [],
          "title": "来源位置"
        },
        {
          "items": [],
          "paragraphs": [
            "已按第10版PDF页43–47、95、97核验。部分说法成立，但固定比例和引导楔形的单一内部序列不能作为原书硬规则。"
          ],
          "title": "当前核验状态"
        },
        {
          "items": [
            "推动浪中浪4通常不能进入浪1的价格区域；楔形是这一重叠规则的结构例外。",
            "浪3必须超过浪1的终点，而且永远不能是浪1、浪3、浪5中最短的一浪。",
            "引导楔形可出现在浪1或锯齿A浪；终结楔形可出现在浪5或锯齿、平台的C浪。",
            "遇到浪1与浪4重叠时，先检查是否为楔形而不是立即否定全部数浪，作为排查思路与原书兼容。"
          ],
          "paragraphs": [],
          "title": "与原书一致之处"
        },
        {
          "items": [
            "浪3达到浪1两倍以上才按延长浪处理，以及浪5不得长于浪3的固定门槛。",
            "浪5缩短时浪4回撤浪3的50%、浪5回撤浪4的80%的配套要求。",
            "小级别浪2/浪4回撤不得大于更大级别对应回撤的说法。",
            "“多数楔形浪5不会最长、扩散楔形除外”的固定筛选条件。"
          ],
          "paragraphs": [],
          "title": "尚未获得原书支持之处"
        },
        {
          "items": [
            "文档把引导楔形绝对规定为5-3-5-3-5且不得扩散；第10版PDF页97说明其浪1、浪3、浪5通常细分为锯齿形，也可能呈推动浪，并允许会聚或扩散形态，不能固定成唯一序列。",
            "终结楔形通常是3-3-3-3-3，但不能只凭这一点确认；仍要同时检查五段结构、位置和趋势线形态。",
            "原书对“延长”主要给出相对长度与常见比例指南，没有文档中的两倍硬门槛。"
          ],
          "paragraphs": [],
          "title": "可能存在的冲突"

      "sections": [
        {
          "items": [],
          "paragraphs": [
            "联合形由两个或三个调整模式组成，以一个或两个X调整浪反向连接，标记为W-X-Y(-X-Z)。多重锯齿由两三个锯齿组成；双重三浪可由锯齿、平台和末端三角形组合；三角形只能作为联合形最后一个作用模式。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [
            "候选结构被标记为双重或三重联合调整"
          ],
          "paragraphs": [],
          "title": "强制规则"
        },
        {
          "items": [
            "候选结构被标记为双重或三重联合调整",
            "三重三浪罕见",
            "原书未观察到扩散平台作为联合形成分"
          ],
          "paragraphs": [],
          "title": "指南"
        },
        {
          "items": [
            "分别验证W、X、Y、Z的独立结构",
            "判断总体是陡直多重锯齿还是横向双重/三重三浪",
            "检查三角形是否在末端"
          ],
          "paragraphs": [],
          "title": "识别与检查步骤"
        },
        {
          "items": [],
          "paragraphs": [
            "第10版原书与逐页蒸馏共同支持；来源页已迁移，重点规则另有冲突核验。"
          ],
          "title": "确认条件"
        },
        {
          "items": [
            "连接浪X不是调整结构",
            "三角形不是最后一个作用模式",
            "把多重锯齿和横向双重三浪混为同一结构"
          ],
          "paragraphs": [],
          "title": "失效条件"
        },
        {
          "items": [
            "只检查其中一条规则，忽略同一形态的其他必需条件。",
            "脱离大一级趋势、浪级、市场类型或历史时点直接套用。"

      "sections": [
        {
          "items": [],
          "paragraphs": [
            "平台形是3-3-5的A-B-C调整，包括规则平台、扩散平台和顺势平台。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [
            "B浪至少回撤A浪90%。",
            "A浪不能是三角形。",
            "C浪必须是推动或斜纹。"
          ],
          "paragraphs": [],
          "title": "强制规则"
        },
        {
          "items": [],
          "paragraphs": [
            "B浪通常回撤A浪100%–138%；C浪通常为A浪100%–165%并多超过A终点。B超过A的105%且C超过A终点时可归扩散平台；B超过A起点但C未超过A终点时可归顺势平台。"
          ],
          "title": "指南"
        },
        {
          "items": [
            "先量B/A是否达到90%。",
            "检查A非三角、C为允许的驱动结构。",
            "再按B与C终点位置区分子类型。",
            "对顺势平台要求更强的趋势背景与内部证据。"
          ],
          "paragraphs": [],
          "title": "识别与检查步骤"
        },
        {
          "items": [],
          "paragraphs": [
            "三条硬规则成立，且B、C终点关系与某个平台子类型一致。"
          ],
          "title": "确认条件"
        },
        {
          "items": [],
          "paragraphs": [
            "B回撤不足90%，A为三角，或C不是推动/斜纹。"
          ],
          "title": "失效条件"
        },
        {
          "items": [
            "使用频道70%阈值代替原书90%硬规则。",
            "把C浪固定比例上限当原书规则；原书给出的是常见区间而非200%或300%硬上限。",
            "过早标记罕见的顺势平台。"
          ],
          "paragraphs": [],
          "title": "常见错误"
        },
        {
          "items": [],
          "paragraphs": [
            "B不足90%时优先检查锯齿；出现更复杂横向结构时检查双重三浪。"
          ],
          "title": "相关浪形与备选解释"
        },

            "第二章书页87，PDF页114。"

      "sections": [
        {
          "items": [],
          "paragraphs": [
            "延长是作用浪内部细分被放大而显著拉长；缩短是第五浪完成必要五个子浪却未超过第三浪终点。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [],
          "paragraphs": [
            "延长和缩短不能覆盖推动浪的核心规则；判缩短必须先确认第五浪内部完成五浪。"
          ],
          "title": "强制规则"
        },
        {
          "items": [
            "多数推动浪只有一个明显延长浪，股票市场最常见浪3延长。",
            "浪1与浪3相近时，浪5延长概率上升；浪3延长时，浪5常与浪1相似。",
            "第五浪缩短常跟随强劲第三浪，并提示大一级反转临近。"
          ],
          "paragraphs": [],
          "title": "指南"
        },
        {
          "items": [
            "比较浪1、3、5的幅度、时间与内部细分。",
            "用浪3不最短和浪4不重叠规则排除错误计数。",
            "判缩短时展开浪5内部五个子浪。"
          ],
          "paragraphs": [],
          "title": "识别与检查步骤"
        },
        {
          "items": [],
          "paragraphs": [
            "延长浪表现出明显扩大的细分；或缩短浪内部五浪完整且终点未越过浪3。"
          ],
          "title": "确认条件"
        },
        {
          "items": [],
          "paragraphs": [
            "仅凭“浪3达到浪1两倍”或固定回撤百分比判定延长、缩短；这些不是原书硬规则。"
          ],
          "title": "失效条件"
        },
        {
          "items": [
            "把浪3延长固定成两倍阈值。",
            "价格没创新高就直接标第五浪缩短。",
            "假设第五浪长度一定不能超过第三浪。"
          ],
          "paragraphs": [],
          "title": "常见错误"
        },
        {
          "items": [],
          "paragraphs": [
            "末端楔形也可能提示竭尽；第五浪未完成内部结构时仍应保留延长或普通第五浪候选。"
          ],
          "title": "相关浪形与备选解释"
        },

            "第二章书页83–84，PDF页110–111。"

      "sections": [
        {
          "items": [],
          "paragraphs": [
            "推动浪细分为五浪；浪2不得运动过浪1起点；浪3必须超过浪1终点且不得成为浪1、3、5中最短者；在通常的现货市场推动浪中，浪4不得进入浪1价格区域。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [
            "候选结构被标记为推动浪",
            "重叠规则按原书所述适用于无杠杆现货市场"
          ],
          "paragraphs": [],
          "title": "强制规则"
        },
        {
          "items": [
            "候选结构被标记为推动浪",
            "重叠规则按原书所述适用于无杠杆现货市场",
            "期货等高杠杆市场的短期极端价格偶见重叠",
            "斜纹浪允许浪1与浪4重叠"
          ],
          "paragraphs": [],
          "title": "指南"
        },
        {
          "items": [
            "依次检查浪2起点、浪3终点与长度、浪4重叠",
            "任何一项失效就重标或检查斜纹浪例外"

        {
          "items": [],
          "paragraphs": [
            "结构失效是价格或内部波浪超出候选形态允许范围；它用于撤销分析结论，也可为风险控制提供客观参考。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [],
          "paragraphs": [
            "触发硬规则失效后必须撤销对应数浪，不能靠主观解释继续维持。"
          ],
          "title": "强制规则"
        },
        {
          "items": [],
          "paragraphs": [
            "结构失效价不自动等于所有账户的最佳止损价，仓位、流动性、滑点和个人承受力需另行设计。"
          ],
          "title": "指南"
        },
        {
          "items": [
            "在分析前写清候选形态与硬规则。",
            "把最接近的结构边界转成可监控条件。",
            "区分“结构失效”“交易止损”“账户最大风险”。",
            "触发后切换备选并重新评估。"
          ],
          "paragraphs": [],
          "title": "识别与检查步骤"
        },
        {
          "items": [],
          "paragraphs": [
            "价格在失效边界内完成所需内部结构，并出现预期方向的新驱动或调整完成证据。"
          ],
          "title": "确认条件"
        },
        {
          "items": [],
          "paragraphs": [
            "越过形态允许边界或内部结构明确不相容。"
          ],
          "title": "失效条件"
        },
        {
          "items": [
            "把主观成本价当结构失效位。",
            "把结构失效位直接用于所有周期和账户。",
            "触发后不切换备选。"
          ],
          "paragraphs": [],
          "title": "常见错误"
        },
        {
          "items": [],
          "paragraphs": [
            "推动、锯齿、平台、三角和斜纹各有不同硬边界，必须调用具体页面。"
          ],
          "title": "相关浪形与备选解释"
        },

          "paragraphs": [
            "驱动浪沿大一级趋势方向推进并细分为五浪，主要形态是推动浪和斜纹浪。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [],
          "paragraphs": [
            "浪2不得完全回撤浪1，浪3必须超过浪1终点且不得最短，浪4不得完全回撤浪3。推动浪另有浪1与浪4不重叠规则；斜纹浪是重叠例外。"
          ],
          "title": "强制规则"
        },
        {
          "items": [],
          "paragraphs": [
            "股票市场最常见浪3延长；斜纹浪较少见，必须先满足位置与内部规则。"
          ],
          "title": "指南"
        },
        {
          "items": [
            "先验证共同推进规则。",
            "再用浪1与浪4是否重叠区分推动与斜纹候选。",
            "检查延长、缩短、通道和成交量等辅助特征。"
          ],
          "paragraphs": [],
          "title": "识别与检查步骤"
        },
        {
          "items": [],
          "paragraphs": [
            "五浪内部结构和推进关系成立，并可明确归入推动或斜纹。"
          ],
          "title": "确认条件"
        },
        {
          "items": [],
          "paragraphs": [
            "浪2越过浪1起点、浪3未超过浪1终点，或浪3成为三个作用浪中最短。"
          ],
          "title": "失效条件"
        },
        {
          "items": [
            "把所有五浪都叫推动浪。",
            "看到重叠就直接作废，不检查斜纹位置。",
            "用比例要求替代推进硬规则。"
          ],
          "paragraphs": [],
          "title": "常见错误"
        },
        {
          "items": [],
          "paragraphs": [
            "下级页面分别处理推动浪、延长与缩短、斜纹浪。"

      "sections": [
        {
          "items": [],
          "paragraphs": [
            "三角形由A-B-C-D-E五个重叠浪组成，至少四个子浪为锯齿或锯齿联合。收缩三角形中C不越过A终点、D不越过B终点、E不越过C终点，边界线随时间会聚；复杂子浪最多一个。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [
            "候选结构被标记为收缩或屏障三角形"
          ],
          "paragraphs": [],
          "title": "强制规则"
        },
        {
          "items": [
            "候选结构被标记为收缩或屏障三角形",
            "扩散三角形的C、D、E必须越过前一同向子浪终点，边界线岔开",
            "屏障三角形的B-D线近于水平"
          ],
          "paragraphs": [],
          "title": "指南"
        },
        {

          ],

        {
          "items": [],
          "paragraphs": [
            "三角形由A-B-C-D-E五个重叠浪组成，常见收缩、屏障和扩散类型，并有顺势变体。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [
            "至少四个子浪为锯齿或锯齿联合。",
            "收缩形的C、D、E不得越过前一个同向子浪终点，边界线会聚。",
            "扩散形的C、D、E必须越过前一个同向子浪终点，边界线岔开。",
            "复杂子浪最多一个。"
          ],
          "paragraphs": [],
          "title": "强制规则"
        },
        {
          "items": [],
          "paragraphs": [
            "三角形通常位于推动浪浪4、ABC的B浪或多重调整的最后X浪。E浪可以不到A-C线或短暂越线；其后常有短促冲击，也可能发展为延长浪。"
          ],
          "title": "指南"
        },
        {
          "items": [
            "标出A至E和两条边界线。",
            "检查至少四个锯齿类子浪及复杂子浪数量。",
            "按收缩、屏障或扩散规则核对终点。",
            "检查其在大一级结构中的位置。"
          ],
          "paragraphs": [],
          "title": "识别与检查步骤"
        },
        {
          "items": [],
          "paragraphs": [
            "五段内部结构、趋势线方向和大一级位置共同一致。"
          ],
          "title": "确认条件"
        },
        {
          "items": [],
          "paragraphs": [
            "结构不足五浪、复杂子浪超过一个，或相应类型的终点推进规则被违反。"
          ],
          "title": "失效条件"
        },
        {
          "items": [
            "把任意五段横盘都画成三角形。",
            "把50%、25%、105%等频道筛选当成原书硬规则；原书总结没有这些统一阈值。",
            "把“通常在浪4/B/X”误写成绝对位置禁令。"
          ],
          "paragraphs": [],
          "title": "常见错误"
        },
        {
          "items": [],
          "paragraphs": [
            "若三角形疑似出现在浪2，先检查它是否只是更大双重三浪的末端组成部分。"
          ],

          "title": "当前核验状态"
        },
        {
          "items": [
            "平台型为A-B-C，内部结构为3-3-5。",
            "A浪不能是三角形；C浪必须是推动浪或终结楔形。",
            "B浪很强不必然代表新趋势，可能仍是平台型的B浪。",
            "原书区分普通平台、扩散平台和顺势平台，判断时必须先确定子类型。"
          ],
          "paragraphs": [],
          "title": "与原书一致之处"
        },
        {
          "items": [
            "B浪不超过A浪200%的统一上限。",
            "B浪、C浪运行时间不超过前浪十倍的限制。",
            "C浪不超过A/B最长浪200%或不超过A浪300%的上限。",
            "“三浪大部分情况下等长”作为平台型专属指南的表述。"
          ],
          "paragraphs": [],
          "title": "尚未获得原书支持之处"
        },
        {
          "items": [
            "文档称B浪最低回撤70%；原书把“至少回撤A浪的90%”列为平台型硬规则。",
            "文档称C浪必须进入A浪价格范围；顺势平台的C浪可以未到达A浪终点，因此不能把该说法当成所有平台型的硬规则。",
            "原书给出的B浪100%至138%、C浪100%至165%等属于常见指南，不应与90%的结构规则混为一类。"
          ],
          "paragraphs": [],

      "sections": [
        {
          "items": [],
          "paragraphs": [
            "斜纹浪是五浪驱动模式，但不是普通推动浪。终结斜纹只允许在推动浪浪5或锯齿、平台C浪；引导斜纹只允许在推动浪浪1或锯齿A浪。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [
            "浪2不得越过浪1起点，浪3必须超过浪1终点，浪4不得越过浪2终点。",
            "浪4通常进入浪1价格区域。",
            "收缩形的作用浪依次缩短；扩散形依次增长。",
            "终结斜纹的作用子浪通常为调整式三浪。"
          ],
          "paragraphs": [],
          "title": "强制规则"
        },
        {
          "items": [
            "引导斜纹浪的浪1、浪3、浪5通常细分为锯齿形，也可能呈推动浪，不能把53535或33333绝对化。",
            "浪2与浪4常回撤前浪0.66–0.81，这是指南，不是硬规则。",
            "终结斜纹常见翻越或小幅缩短，并提示大一级运动竭尽。"
          ],
          "paragraphs": [],
          "title": "指南"
        },
        {
          "items": [
            "先检查出现位置是否合法。",
            "检查浪2、3、4的推进关系。",
            "比较边界线会聚或岔开及各子浪长度。",
            "观察浪5是否翻越、缩短及随后是否快速反转。"
          ],
          "paragraphs": [],
          "title": "识别与检查步骤"
        },
        {
          "items": [],
          "paragraphs": [
            "位置、内部五浪、推进关系和边界特征相互支持；终结形之后出现快速反转可增强确认。"
          ],
          "title": "确认条件"
        },
        {
          "items": [],
          "paragraphs": [
            "出现在允许位置之外，或浪2、3、4违反推进硬规则。"
          ],
          "title": "失效条件"
        },
        {
          "items": [
            "把引导斜纹绝对规定为5-3-5-3-5、终结绝对规定为3-3-3-3-3，而忽略原书记录的引导形变体。",
            "只看楔形外观，不查位置和内部结构。",
            "把翻越当成必须出现。"
          ],
          "paragraphs": [],
          "title": "常见错误"
        },
        {
          "items": [],
          "paragraphs": [
            "若浪1与浪4不重叠，优先检查普通推动；若疑似引导斜纹，也要排除一连串第一浪、第二浪的情况。"
          ],
          "title": "相关浪形与备选解释"
        },
        {
          "items": [
            "第10版PDF页43–47、95、97；图1-15至图1-21。",
            "第11版对应图示仅作为补充展示，不改变第10版规则与指南。"
          ],
          "paragraphs": [],
          "title": "原书来源"
        }

          "paragraphs": [
            "成交量、动量、广泛性、投资者情绪和总体外观用于校验数浪方案和理解波浪位置。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [],
          "paragraphs": [
            "这些信号不能改变浪形硬规则；内部波浪数与总体外观必须彼此相容，不能为凑数而扭曲标记。"
          ],
          "title": "强制规则"
        },
        {
          "items": [
            "正常小浪级以下第五浪成交量常低于第三浪；持平或放大可支持第五浪延长。",
            "A、B、C及1至5各有常见心理特征，但原书明确称这些为趋向而非必然。",
            "良好广泛性通常更符合推动浪，B浪反弹常缺乏广泛确认。"
          ],
          "paragraphs": [],
          "title": "指南"
        },
        {
          "items": [
            "完成至少两个结构候选。",
            "对每个候选检查成交量、动量、广泛性和情绪是否典型。",
            "检查总体外形是否与内部浪数一致。"
          ],
          "paragraphs": [],
          "title": "识别与检查步骤"
        },
        {
          "items": [],
          "paragraphs": [
            "辅助特征与内部结构、通道和比例共同支持同一候选。"
          ],
          "title": "确认条件"
        },
        {
          "items": [],
          "paragraphs": [
            "仅凭情绪、消息或成交量反向修改已经明确失效的结构。"
          ],
          "title": "失效条件"
        },
        {
          "items": [
            "把“第五浪量小”写成绝对规则。",
            "只数内部段数，不看恰当外观。",
            "用消息解释代替结构证据。"
          ],
          "paragraphs": [],
          "title": "常见错误"
        },
        {
          "items": [],
          "paragraphs": [
            "量价表现异常时，可提高延长、翻越、B浪或调整反弹等备选的优先级，但仍需结构确认。"
          ],

          "items": [],
          "paragraphs": [
            "驱动浪、锯齿、平台型、联合型和三角形的分类均与原书结构体系对应；具体规则与例外已进入各核心页面。"
          ],
          "title": "与原书一致之处"
        },
        {
          "items": [],
          "paragraphs": [
            "第三部分的排列顺序，以及把买卖点与浪型规则并列的组织方式，不是原书规则。"
          ],
          "title": "尚未获得原书支持之处"
        },
        {
          "items": [],
          "paragraphs": [
            "买卖点已经降为应用提示：原书的结构失效可以帮助定义分析边界，但不能直接替代交易系统。"
          ],
          "title": "可能存在的冲突"
        },
        {
          "items": [
            "驱动浪（`core-motive`）",
            "调整浪（`core-corrections`）",
            "波浪理论与交易系统的边界（`core-theory-trading`）"
          ],
          "paragraphs": [],
          "title": "对应的核心知识链接"
        }

      "id": "core-wait-unclear",
      "kind": "core",
      "order": 30,

      "related_page_ids": [

      "sections": [
        {
          "items": [],
          "paragraphs": [
            "当调整结构未完成、候选证据接近或没有明显首选时，等待是原书允许且推荐的分析动作。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [],
          "paragraphs": [
            "等待不改变已有硬规则；任何已明确失效的候选仍应删除。"
          ],
          "title": "强制规则"
        },
        {
          "items": [],
          "paragraphs": [
            "复杂调整在完成前难以分类，终点也更难预测。新的五浪、三浪、通道触及或规则失效会逐步提高可辨识度。"
          ],
          "title": "指南"
        },
        {
          "items": [
            "列出尚未解决的结构问题。",
            "指定下一条能区分候选的价格或形态证据。",
            "在证据出现前不强行完成数浪。",
            "更新后重新排序。"
          ],
          "paragraphs": [],
          "title": "识别与检查步骤"
        },
        {
          "items": [],
          "paragraphs": [
            "新出现的内部结构或失效条件使一个候选明显优于其他方案。"
          ],
          "title": "确认条件"
        },
        {
          "items": [],
          "paragraphs": [
            "把“看不清”包装成确定方向，或为填满A-B-C-D-E而提前标记未完成结构。"
          ],
          "title": "失效条件"
        },
        {
          "items": [
            "抢跑标记三角形。",
            "调整中频繁改浪级来维持单一观点。",
            "认为每个时刻都必须持仓或给出答案。"
          ],
          "paragraphs": [],
          "title": "常见错误"
        },
        {
          "items": [],
          "paragraphs": [
            "三角形和联合形最容易在未完成时被过早识别，应优先使用等待原则。"
          ],
          "title": "相关浪形与备选解释"
        },
        {
          "items": [
            "第一章“调整浪”，书页29，PDF页56。",
            "第二章“实际应用”，书页96，PDF页123。"
          ],
          "paragraphs": [],
          "title": "原书来源"
        }

      "sections": [
        {
          "items": [],
          "paragraphs": [
            "调整浪逆大一级趋势运行，结构比驱动浪更复杂，主要包括锯齿、平台、三角及其联合。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [],
          "paragraphs": [
            "完整调整浪不能只是一个独立五浪。每一种具体调整形态另有内部结构与失效条件，必须逐类检查。"
          ],
          "title": "强制规则"
        },
        {
          "items": [],
          "paragraphs": [
            "调整浪在形成过程中难以提前分类，终点也比驱动浪难预测，应保留多个候选并允许复杂度增加。"
          ],
          "title": "指南"
        },
        {
          "items": [
            "判断整体更像陡直价格调整还是横向时间调整。",
            "检查A浪内部是五浪还是三浪。",
            "依次尝试锯齿、平台、三角和联合规则。",
            "不清楚时等待，不强行完成标记。"
          ],
          "paragraphs": [],
          "title": "识别与检查步骤"
        },
        {
          "items": [],
          "paragraphs": [
            "内部子浪、位置和形态硬规则共同指向某一调整类型。"
          ],
          "title": "确认条件"
        },
        {
          "items": [],
          "paragraphs": [
            "候选调整的内部结构或关键回撤越过原书硬边界。"
          ],
          "title": "失效条件"
        },
        {
          "items": [
            "把任意三段都叫ABC，却不检查5-3-5或3-3-5。",
            "把多重锯齿与横向联合混为一谈。",
            "调整尚未完成就预测唯一终点。"
          ],
          "paragraphs": [],
          "title": "常见错误"
        },
        {
          "items": [],
          "paragraphs": [
            "进入下级锯齿、平台、三角和联合页面逐项排除。"
          ],
          "title": "相关浪形与备选解释"
        },
        {
          "items": [
            "第一章“调整浪”，书页28–45，PDF页55–72。",
            "第二章规则总结，书页86–90，PDF页113–117。"
          ],
          "paragraphs": [],
          "title": "原书来源"
        }
      ],

          "paragraphs": [
            "构造指南用于估计典型外形、目标区、持续时间和确认信号，只在浪形硬规则成立后使用。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [],
          "paragraphs": [
            "本页不新增形态硬规则。任何交替、等同、通道、成交量或个性特征都不能覆盖已经发生的结构失效。"
          ],
          "title": "强制规则"
        },
        {
          "items": [],
          "paragraphs": [
            "交替、调整深度、波浪等同、通道、刻度、成交量和个性应被当作相互独立的证据组合。"
          ],
          "title": "指南"
        },
        {
          "items": [
            "先通过目标浪形规则。",
            "选择与当前位置相关的指南。",
            "记录支持、反对和中性证据。",
            "根据证据组合调整候选排序。"
          ],
          "paragraphs": [],
          "title": "识别与检查步骤"
        },
        {
          "items": [],
          "paragraphs": [
            "多个独立指南与同一候选结构方向一致，且没有硬规则冲突。"
          ],
          "title": "确认条件"
        },
        {
          "items": [],
          "paragraphs": [
            "用指南直接宣布结构必然成立或必然失效。"
          ],
          "title": "失效条件"
        },
        {
          "items": [
            "看见0.618就结束分析。",
            "让通道线决定内部波浪数。",
            "把成交量和市场情绪叫作硬规则。"
          ],
          "paragraphs": [],
          "title": "常见错误"

        {
          "items": [],
          "paragraphs": [
            "进入交替与深度、等同与通道、成交量与个性页面查看具体用法。"
          ],

      "sections": [
        {
          "items": [],
          "paragraphs": [
            "波浪理论用于限定路径、排序概率、估计目标与确定结构边界，是构建交易方法的基础，但不是完整交易系统。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [],
          "paragraphs": [
            "原书不保证波浪理论始终有效；任何交易结论都不能表述为保证盈利。"
          ],
          "title": "强制规则"
        },
        {
          "items": [],
          "paragraphs": [
            "分析能力、执行、情绪控制、资金管理和实际盈利是不同技能。投入风险资金应远小于净资产，并能承受失败。"
          ],
          "title": "指南"
        },
        {
          "items": [
            "分开记录结构分析和交易计划。",
            "交易计划另含触发、仓位、止损、滑点与最大损失。",
            "复盘时区分分析错误、执行错误和风险管理错误。"
          ],
          "paragraphs": [],
          "title": "识别与检查步骤"
        },
        {
          "items": [],
          "paragraphs": [
            "结构方案与交易触发分别得到验证，账户风险在预设范围内。"
          ],
          "title": "确认条件"
        },
        {
          "items": [],
          "paragraphs": [
            "把浪形预测直接当成机械买卖点，或把结构失效替代完整资金管理。"
          ],
          "title": "失效条件"
        },
        {
          "items": [
            "用“确认浪型”代替具体交易触发。",
            "把模拟正确率当真实盈利能力。",
            "忽略备选方案和极端执行风险。"
          ],
          "paragraphs": [],
          "title": "常见错误"
        },
        {
          "items": [],
          "paragraphs": [
            "理论页面只提供结构依据；实际账户策略需单独维护，不能反向修改理论规则。"
          ],
          "title": "相关浪形与备选解释"
        },
        {
          "items": [
            "第二章“实际应用”，书页94–98，PDF页121–125。"
          ],
          "paragraphs": [],
          "title": "原书来源"
        }
      ],

            "文档称联合型可写为W-X-Y或W-X-Y-XX-Z，用于单一调整无法解释的复杂横向结构。",
            "截图称W浪和X浪可以采用除三角形与联合型以外的调整结构；Y浪可以是三角形，但当Z浪存在时截图对Y浪另有限制。",
            "文档称X和XX至少要回撤70%，太浅时不像连接段。",
            "文档称Y要突破W的极点，Z要突破Y的极点；截图把三角形Y列为例外。",
            "截图称Y浪在价格和时间上不大于W浪和X浪的五倍，Z浪同理。",
            "截图称如果Y浪比W浪长，Z浪不能大于W浪的两倍。",
            "文档称如果W是单锯齿，Y不能再是单锯齿，用于区分联合型和双锯齿。"
          ],

          "title": "原始说法"
        },
        {
          "items": [

        {

          "title": "当前核验状态"
        },
        {
          "items": [
            "联合型以W-X-Y或W-X-Y-X-Z表示，由X浪连接两个或三个调整结构。",
            "它通常用于解释单一调整不能完整描述的横向运动。",
            "三角形若出现，通常位于整个联合结构的最后一个作用浪位置。",
            "双锯齿和横向联合虽然都可写作W-X-Y，但内部构成和方向性不同，必须分开识别。"

      "sections": [
        {
          "items": [],
          "paragraphs": [
            "联合形把两个或三个完整调整模式用X浪连接，标记为W-X-Y或W-X-Y-X-Z。多重锯齿与横向双重/三重三浪都使用相似字母，但调整目的不同。"
          ],
          "title": "定义与适用范围"
        },
        {
          "items": [
            "X浪必须是调整结构。",
            "W、Y、Z必须分别是完整允许的调整模式。",
            "三角形只能作为联合形最后一个作用模式。",
            "多重锯齿由锯齿组成；横向联合可由锯齿、平台及末端三角形组合。"
          ],
          "paragraphs": [],
          "title": "强制规则"
        },
        {
          "items": [],
          "paragraphs": [
            "当第一个锯齿或平台相对前一波浪过小、不像完整调整时，联合继续的可能性上升。横向联合主要延长时间，多重锯齿主要增加价格回撤。"
          ],
          "title": "指南"
        },
        {
          "items": [
            "分别验证W、X、Y、Z内部结构。",
            "判断整体是陡直增加价格回撤，还是横向延长时间。",
            "检查三角形是否位于最后。"
          ],
          "paragraphs": [],
          "title": "识别与检查步骤"
        },
        {
          "items": [],
          "paragraphs": [
            "每个分量独立成立，连接关系清楚，并符合多重锯齿或横向联合的目的与外形。"
          ],
          "title": "确认条件"
        },
        {
          "items": [],
          "paragraphs": [
            "X不是调整浪，分量无法独立成立，或三角形出现在非末端作用位置。"
          ],
          "title": "失效条件"
        },
        {
          "items": [
            "把X/XX至少回撤70%、Y/Z必须突破前一极点、五倍或两倍上限当成原书规则；原书总结未给这些统一硬限制。",
            "因为W是锯齿就绝对禁止Y为锯齿；这只适用于区分横向联合与多重锯齿的分类逻辑。"
          ],
          "paragraphs": [],
          "title": "常见错误"
        },
        {
          "items": [],
          "paragraphs": [
            "W与Y都是锯齿且整体继续价格回撤时，优先归入双重锯齿；形态横向且分量交替时，优先检查双重三浪。"
          ],
          "title": "相关浪形与备选解释"
        },

            "文档称三角形A浪可为平台或锯齿，B浪只能为锯齿，C浪和D浪可为三角形以外的调整浪，E浪可为三角或锯齿。",
            "截图称收缩三角形的B/C/D浪不应超过前一浪约105%；B至少回撤A的50%，C至少回撤B的50%且不大于B，D至少回撤C的50%且不大于C。",
            "截图称E浪至少回撤D浪的25%且不大于D，并另外讨论E达到25%但没有进入A浪相关区域的情况，后半句在截图中不完整。",
            "文档称三角形常出现在第四浪、B浪或X浪，不要轻易把第二浪画成三角形。",
            "截图称三角形作为一个作用浪中的最后一个反作用浪出现，并补充当其位于X浪时对后续三锯齿或三重联合存在限制。",
            "文档使用这些形态和比例来排除“任意五段横盘都是三角形”的误判。"
          ],
          "paragraphs": [],
          "title": "原始说法"
        },
        {
          "items": [
            "Word“3.5 三角形”",
            "Word表8：允许形态、收缩比例与位置",

          "paragraphs": [],
          "title": "来源位置"
        },
        {
          "items": [],
          "paragraphs": [
            "五段结构、类型和常见位置获原书支持；子浪绝对列表与105%/50%/25%固定比例没有原书依据，部分表述过严。"
          ],
          "title": "当前核验状态"
        },
        {
          "items": [
            "三角形由A-B-C-D-E五段组成，整体为3-3-3-3-3倾向。",
            "原书区分收缩、障碍、扩散和顺势等表现。",
            "三角形通常出现在浪4、B浪或联合型最后一个X/作用浪位置；不应轻易把浪2标为三角形。",
            "E浪可能短于边界，也可能短暂越过趋势线；不能只凭一次触线确认完成。"
          ],
          "paragraphs": [],
          "title": "与原书一致之处"
        },
        {
          "items": [
            "B/C/D约105%的上限。",
            "B/C/D逐浪至少50%、不超过前浪，以及E浪25%至100%的固定回撤要求。",
            "E浪达到25%但未进入A浪相关区域时的截图后续条件。",
            "X浪三角形与三锯齿或三重联合之间的频道限制。"
          ],
          "paragraphs": [],
          "title": "尚未获得原书支持之处"
        },
        {
          "items": [
            "“B浪只能是锯齿”过严。原书允许三角形的一个子浪发展成更复杂的调整组合，并非每段都只能是单一锯齿。",

          "paragraphs": [

          "items": [

          "paragraphs": [

          "title": "失效条件"

        {
          "items": [
            "把最高概率说成确定结果。",

  function buildSearchIndex() {
    return data.pages.map((page, order) => {
      const parent = allById.get(page.parent);
      const sectionText = (page.sections || []).flatMap(section => [
        section.title || "",
        ...(section.paragraphs || []),
        ...(section.items || []).map(item => (
          typeof item === "string" ? item : JSON.stringify(item)
        ))
      ]).join(" ");
      return {
        id: page.id,
        title: page.title,
        branch: parent ? parent.title : "知识库",
        order,
        searchable: `${page.title} ${parent ? parent.title : ""} ${sectionText}`.toLocaleLowerCase("zh-CN")
      };
    });
  }

  function searchKnowledge(rawQuery, limit = 8) {
    const query = String(rawQuery || "").trim().toLocaleLowerCase("zh-CN");
    if (query.length < 2) return [];
    return knowledgeSearchIndex
      .filter(item => item.searchable.includes(query))
      .sort((a, b) => {
        const aTitle = a.title.toLocaleLowerCase("zh-CN").includes(query) ? 0 : 1;
        const bTitle = b.title.toLocaleLowerCase("zh-CN").includes(query) ? 0 : 1;
        return aTitle - bTitle || a.order - b.order;
      })
      .slice(0, limit);
  }

  function resolveKnowledgeTarget(text, page) {
    const explicitMatch = text.match(/`((?:core|unit|candidate)-[^`]+)`/);
    if (explicitMatch) {
      const explicit = pageById.get(explicitMatch[1]);
      if (explicit && explicit.id !== page.id) return explicit;
    }
    const unitMatch = text.match(/\b(ewp-[a-z0-9-]+)\b/i);
    if (unitMatch) {
      const unitId = unitMatch[1];
      const targetId = `unit-${unitId}`;
      const unitTarget = pageById.get(targetId) || unitPageByUnitId.get(unitId);
      if (unitTarget && unitTarget.id !== page.id) return unitTarget;
    }
    const exact = uniquePageByTitle.get(text.trim());
    return exact && exact.id !== page.id ? exact : null;
  }

  function knowledgeLink(target, label, buttonStyle = false) {
    const link = document.createElement("a");
    link.href = `#page=${encodeURIComponent(target.id)}`;
    link.className = buttonStyle ? "btn btn-ghost" : "kb-knowledge-link";
    link.textContent = label;
    link.addEventListener("click", event => {
      event.preventDefault();
      navigateToPage(target.id);
    });
    return link;
  }

  function appendLinkedText(container, text, page) {
    const exact = resolveKnowledgeTarget(text, page);
    if (exact) {
      container.appendChild(knowledgeLink(exact, text));
      return;
    }
    let cursor = 0;
    while (cursor < text.length) {
      let best = null;
      for (const title of linkableTitles) {
        const target = uniquePageByTitle.get(title);
        if (!target || target.id === page.id) continue;
        const index = text.indexOf(title, cursor);
        if (index < 0) continue;
        if (!best || index < best.index || (index === best.index && title.length > best.title.length)) {
          best = { index, title, target };
        }
      }
      if (!best) {
        container.appendChild(document.createTextNode(text.slice(cursor)));
        break;
      }
      if (best.index > cursor) {
        container.appendChild(document.createTextNode(text.slice(cursor, best.index)));
      }
      container.appendChild(knowledgeLink(best.target, best.title));
      cursor = best.index + best.title.length;
    }
  }

  function makeTree(items, parentId) {
    const list = document.createElement("ul");
    list.className = "kb-tree-list";
    list.setAttribute("role", parentId ? "group" : "tree");
    items.forEach(item => {
      const itemChildren = children.get(item.id) || [];
      const hasChildren = itemChildren.length > 0;
      const listItem = document.createElement("li");
      listItem.className = "kb-tree-item";
      listItem.setAttribute("role", "treeitem");
      listItem.setAttribute("aria-selected", String(item.id === selectedId));
      if (hasChildren) listItem.setAttribute("aria-expanded", String(expanded.has(item.id)));
      const button = document.createElement("button");
      button.type = "button";
      button.className = "btn btn-ghost";
      button.setAttribute("aria-pressed", String(item.id === selectedId));
      button.textContent = `${hasChildren ? (expanded.has(item.id) ? "− " : "+ ") : ""}${item.title}`;
      button.addEventListener("click", () => {
        if (hasChildren) {
          expanded.has(item.id) ? expanded.delete(item.id) : expanded.add(item.id);
        }
        if (!pageById.has(item.id) || !navigateToPage(item.id)) render();
      });
      listItem.appendChild(button);
      if (hasChildren && expanded.has(item.id)) listItem.appendChild(makeTree(itemChildren, item.id));
      list.appendChild(listItem);
    });
    return list;
  }

  function breadcrumb(page) {
    const chain = [];
    let current = page;
    while (current) {
      chain.unshift(current);
      current = current.parent ? allById.get(current.parent) : null;
    }
    const list = document.createElement("ol");
    list.className = "kb-breadcrumb-list";
    chain.forEach((item, index) => {
      const li = document.createElement("li");
      if (index) li.appendChild(document.createTextNode("› "));
      if (pageById.has(item.id) && item.id !== page.id) {
        li.appendChild(knowledgeLink(item, item.title));
      } else {
        li.appendChild(document.createTextNode(item.title));
      }
      list.appendChild(li);
    });
    return list;
  }

  function sectionElement(section, page) {
    const wrapper = document.createElement("section");
    wrapper.className = "kb-section";

  function updateImageViewerLayout({ resetScroll = false } = {}) {
    const naturalWidth = imageViewerImage.naturalWidth;
    const naturalHeight = imageViewerImage.naturalHeight;
    if (!naturalWidth || !naturalHeight || imageViewer.hidden) return;
    const horizontalPadding = window.innerWidth <= 700 ? 26 : 52;
    const verticalPadding = window.innerWidth <= 700 ? 26 : 52;
    const widthRatio = Math.max(0.05, (imageViewerViewport.clientWidth - horizontalPadding) / naturalWidth);
    const heightRatio = Math.max(0.05, (imageViewerViewport.clientHeight - verticalPadding) / naturalHeight);
    const fitRatio = Math.min(1, widthRatio, heightRatio);
    imageViewerBaseSize = {
      width: Math.max(1, Math.round(naturalWidth * fitRatio)),
      height: Math.max(1, Math.round(naturalHeight * fitRatio))
    };
    setImageViewerScale(imageViewerScale, { resetScroll });
  }

  function setImageViewerScale(nextScale, { resetScroll = false } = {}) {
    if (!imageViewerBaseSize.width || !imageViewerBaseSize.height) return;
    const previousScrollWidth = imageViewerStage.scrollWidth || imageViewerViewport.clientWidth;
    const previousScrollHeight = imageViewerStage.scrollHeight || imageViewerViewport.clientHeight;
    const centerRatioX = (imageViewerViewport.scrollLeft + imageViewerViewport.clientWidth / 2) / previousScrollWidth;
    const centerRatioY = (imageViewerViewport.scrollTop + imageViewerViewport.clientHeight / 2) / previousScrollHeight;
    imageViewerScale = Math.min(
      imageViewerMaximumZoom,
      Math.max(imageViewerMinimumZoom, Number(nextScale.toFixed(2)))
    );
    const displayedWidth = Math.round(imageViewerBaseSize.width * imageViewerScale);
    const displayedHeight = Math.round(imageViewerBaseSize.height * imageViewerScale);
    imageViewerImage.style.width = `${displayedWidth}px`;
    imageViewerStage.style.width = `${Math.max(imageViewerViewport.clientWidth, displayedWidth + 48)}px`;
    imageViewerStage.style.height = `${Math.max(imageViewerViewport.clientHeight, displayedHeight + 48)}px`;
    imageViewerZoom.value = `${Math.round(imageViewerScale * 100)}%`;
    imageViewerZoom.textContent = imageViewerZoom.value;
    imageViewerButtons.get("zoom-out").disabled = imageViewerScale <= imageViewerMinimumZoom;
    imageViewerButtons.get("zoom-in").disabled = imageViewerScale >= imageViewerMaximumZoom;
    requestAnimationFrame(() => {
      if (resetScroll) {
        imageViewerViewport.scrollLeft = Math.max(0, (imageViewerStage.scrollWidth - imageViewerViewport.clientWidth) / 2);
        imageViewerViewport.scrollTop = Math.max(0, (imageViewerStage.scrollHeight - imageViewerViewport.clientHeight) / 2);
        return;
      }
      imageViewerViewport.scrollLeft = Math.max(
        0,
        centerRatioX * imageViewerStage.scrollWidth - imageViewerViewport.clientWidth / 2
      );
      imageViewerViewport.scrollTop = Math.max(
        0,
        centerRatioY * imageViewerStage.scrollHeight - imageViewerViewport.clientHeight / 2
      );
    });
  }

  function resetImageViewer() {
    imageViewerScale = 1;
    updateImageViewerLayout({ resetScroll: true });
  }

  function openImageViewer({ src, alt, title, caption }) {
    window.clearTimeout(imageViewerCloseTimer);
    imageViewerPreviousFocus = document.activeElement;
    imageViewerTitle.textContent = title || "原书图示";
    imageViewerCaption.textContent = caption || "";
    imageViewerImage.alt = alt || title || "原书图示";
    imageViewerScale = 1;
    imageViewerBaseSize = { width: 0, height: 0 };
    imageViewer.hidden = false;
    document.body.classList.add("kb-image-viewer-open");
    imageViewerImage.src = src;
    requestAnimationFrame(() => {
      imageViewer.classList.add("is-open");
      imageViewerButtons.get("close").focus({ preventScroll: true });
      if (imageViewerImage.complete) updateImageViewerLayout({ resetScroll: true });
    });
  }

  function closeImageViewer() {
    if (imageViewer.hidden) return;
    imageViewer.classList.remove("is-open");
    document.body.classList.remove("kb-image-viewer-open");
    const finishClose = () => {
      imageViewer.hidden = true;
      imageViewerImage.removeAttribute("src");
      imageViewerImage.style.removeProperty("width");
      imageViewerStage.style.removeProperty("width");
      imageViewerStage.style.removeProperty("height");
      if (imageViewerPreviousFocus?.isConnected) {
        imageViewerPreviousFocus.focus({ preventScroll: true });
      }
      imageViewerPreviousFocus = null;
    };
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      finishClose();
      return;
    }
    imageViewerCloseTimer = window.setTimeout(finishClose, 180);
  }

  imageViewerImage.addEventListener("load", () => {
    updateImageViewerLayout({ resetScroll: true });
  });
  imageViewer.addEventListener("click", event => {
    if (event.target === imageViewer) closeImageViewer();
  });
  imageViewerButtons.forEach((button, action) => {
    button.addEventListener("click", () => {
      if (action === "zoom-out") setImageViewerScale(imageViewerScale - imageViewerZoomStep);
      if (action === "zoom-in") setImageViewerScale(imageViewerScale + imageViewerZoomStep);
      if (action === "reset") resetImageViewer();
      if (action === "close") closeImageViewer();
    });
  });
  imageViewerViewport.addEventListener("wheel", event => {
    if (!event.ctrlKey && !event.metaKey) return;
    event.preventDefault();
    setImageViewerScale(
      imageViewerScale + (event.deltaY < 0 ? imageViewerZoomStep : -imageViewerZoomStep)
    );
  }, { passive: false });
  imageViewerImage.addEventListener("dblclick", () => {
    setImageViewerScale(imageViewerScale === 1 ? 2 : 1, { resetScroll: imageViewerScale !== 1 });
  });
  document.addEventListener("keydown", event => {
    if (imageViewer.hidden) return;
    if (event.key === "Escape") closeImageViewer();
    if (event.key === "+" || event.key === "=") setImageViewerScale(imageViewerScale + imageViewerZoomStep);
    if (event.key === "-" || event.key === "_") setImageViewerScale(imageViewerScale - imageViewerZoomStep);
    if (event.key === "0") resetImageViewer();
  });
  window.addEventListener("resize", () => {
    if (!imageViewer.hidden) updateImageViewerLayout();
  });

  function formatDate(value) {
    const parts = String(value || "").split("-").map(Number);
    if (parts.length !== 3 || parts.some(Number.isNaN)) return value || "未记录";
    return `${parts[0]}年${parts[1]}月${parts[2]}日`;
  }

  function formatBytes(value) {
    const bytes = Number(value || 0);
    if (!bytes) return "未提供";
    if (bytes >= 1024 * 1024) return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
    if (bytes >= 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${bytes} B`;
  }

    renderHomeButton();
    renderKnowledgeTree();
    communityUI.render(route);
  }

  window.addEventListener("hashchange", renderLocation);
  communityUI.renderAccount();
  authController.start().catch(() => communityUI.renderAccount());
  renderLocation();
})();
</script>
</body>
</html>
