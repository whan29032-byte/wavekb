name: Verify WaveKB release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://odmtxwlnlvwldrjttyqu.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_PGarmRpGdqoro6CGEmxsxw_LO0eWVAL
  NEXT_PUBLIC_LEGACY_SITE_URL: https://wavekb.com
  AUTH_GATEWAY_INTERNAL_URL: http://127.0.0.1:8787
  AUTH_GATEWAY_PUBLIC_ORIGIN: https://wavekb.com

concurrency:
  group: wavekb-release-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run legacy and workspace tests
        run: pnpm test

      - name: Run strict TypeScript checks
        run: pnpm typecheck

      - name: Lint the Next.js application
        run: pnpm --filter @wavekb/web lint

      - name: Build the Next.js application
        run: pnpm --filter @wavekb/web build

      - name: Build Storybook
        run: pnpm --filter @wavekb/web storybook:build

      - name: Install the Playwright browser
        run: pnpm --filter @wavekb/web exec playwright install --with-deps chromium

      - name: Run public route acceptance tests
        run: pnpm --filter @wavekb/web test:e2e
