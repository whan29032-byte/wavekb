name: Deploy WaveKB database and gateway production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_WAVEKB_BACKEND to apply the exact database migration and release the gateway"
        required: true
        type: string
      private_research:
        description: "Preserve configuration, or enable/disable the reviewed private research artifact (never enables the model)"
        required: true
        type: choice
        default: preserve
        options:
          - preserve
          - enable
          - disable
      managed_ai:
        description: "Preserve configuration, or enable/disable membership DeepSeek after metadata and conservative cost validation (never changes keys or membership rights)"
        required: true
        type: choice
        default: preserve
        options:
          - preserve
          - enable
          - disable
      trading_cutover:
        description: "Preserve, enable, or disable only the automatic-workbench master flag"
        required: true
        type: choice
        default: preserve
        options:
          - preserve
          - enable
          - disable
      trading_provider_binance:
        description: "Stage the Binance read-only sync flag independently"
        required: true
        type: choice
        default: preserve
        options: [preserve, enable, disable]
      trading_provider_okx:
        description: "Stage the OKX read-only sync flag independently"
        required: true
        type: choice
        default: preserve
        options: [preserve, enable, disable]
      trading_provider_bybit:
        description: "Stage the Bybit read-only sync flag independently"
        required: true
        type: choice
        default: preserve
        options: [preserve, enable, disable]
      trading_provider_bitget:
        description: "Stage the Bitget read-only sync flag independently"
        required: true
        type: choice
        default: preserve
        options: [preserve, enable, disable]
      trading_provider_exness:
        description: "Stage the Exness read-only sync flag independently"
        required: true
        type: choice
        default: preserve
        options: [preserve, enable, disable]

permissions:
  contents: read

concurrency:
  group: wavekb-backend-production
  cancel-in-progress: false

jobs:
  verify-release:
    uses: ./.github/workflows/verify-release.yml

  migrate-and-deploy:
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Require main and explicit production confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = DEPLOY_WAVEKB_BACKEND

      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Verify gateway and deployment contracts
        run: |
          set -Eeuo pipefail
          pnpm install --frozen-lockfile
          node scripts/validate-knowledge.mjs
          pnpm --dir ai-gateway typecheck
          pnpm --dir ai-gateway test
          node --test tests/ai-gateway-packaging.test.mjs tests/deploy-preflight.test.mjs tests/deploy-workflow.test.mjs tests/hermes-theory-artifact.test.mjs tests/hermes-private-research-postgres.test.mjs tests/wave-analysis-images-postgres.test.mjs tests/trading-leaderboard.test.mjs tests/trading-leaderboard-postgres.test.mjs tests/multi-exchange-trading-postgres.test.mjs tests/trade-chart-private-postgres.test.mjs tests/trading-release-preflight.test.mjs tests/reward-lottery-postgres.test.mjs tests/mentor-checkout-postgres.test.mjs tests/mentor-notification-postgres.test.mjs tests/admin-mentor-publish-postgres.test.mjs tests/mentor-service-lifecycle-postgres.test.mjs tests/youtube-sync-postgres.test.mjs tests/youtube-policy-consent-postgres.test.mjs tests/admin-payment-hardening-postgres.test.mjs tests/mentor-payment-webhook.test.mjs tests/mentor-checkout-function.test.mjs tests/membership-foundation-postgres.test.mjs tests/membership-commerce-postgres.test.mjs tests/membership-payment-functions.test.mjs tests/membership-benefits-postgres.test.mjs tests/membership-wallet-postgres.test.mjs tests/membership-wallet-functions.test.mjs
          node scripts/trading-release-preflight.mjs --static

      - name: Package immutable gateway release
        run: |
          set -Eeuo pipefail
          printf '%s\n' "$GITHUB_SHA" > ai-gateway/DEPLOYMENT_VERSION
          cp scripts/trading-release-preflight.mjs ai-gateway/release-preflight.mjs
          tar -C ai-gateway -czf wavekb-gateway.tar.gz package.json src knowledge/retrieval-index.json DEPLOYMENT_VERSION release-preflight.mjs

      - name: Configure pinned SSH access
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_FINGERPRINT: SHA256:VDPcrNGSByDvXoaFy8GUJaqSNWS9tfyekTMi8zPXeE8
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 15 -t ed25519 "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null && break
            sleep $((attempt * 2))
          done
          test -s "$HOME/.ssh/known_hosts"
          actual_fingerprint=$(ssh-keygen -lf "$HOME/.ssh/known_hosts" | awk '{print $2}')
          test "$actual_fingerprint" = "$DEPLOY_HOST_FINGERPRINT"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts" "$HOME/.ssh/deploy_key"

      - name: Verify gateway host before schema access
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -Eeuo pipefail
          gateway_state=$(sudo -n systemctl show elliott-wave-gateway.service -p ActiveState --value)
          gateway_workdir=$(sudo -n systemctl show elliott-wave-gateway.service -p WorkingDirectory --value)
          echo "Gateway state: ${gateway_state}"
          echo "Gateway working directory: ${gateway_workdir}"
          if test -L /opt/elliott-wave-gateway/current; then
            echo "Gateway release layout: symlink"
          else
            echo "Gateway release layout: legacy directory"
          fi
          echo "Node version: $(/usr/bin/node --version)"
          test "$gateway_state" = active
          test "$gateway_workdir" = /opt/elliott-wave-gateway/current
          test -d /opt/elliott-wave-gateway/current
          sudo -n true
          sudo test -f /etc/elliott-wave/gateway.env
          /usr/bin/node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
          curl --fail --silent --show-error http://127.0.0.1:8787/health > /dev/null
          REMOTE
      - name: Apply exact production migrations and verify schema marker
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -Eeuo pipefail
          test -n "$SUPABASE_DB_URL"
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          schema_before=$(psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c 'select public.wavekb_schema_version();' | tr -d '[:space:]')
          # Validate the marker before any DDL, then repair this marker-neutral
          # baseline even when the latest version has already been recorded.
          case "$schema_before" in
            202609090002|202609100001|202610080001|202610080002|202610080003|202610080004|202610100001|202610100002|202610100003|202610100004|202610100005|20261010223739|20261011001354|20261011152711|202610190001|202610220001|202610220002|202611240001|202611240002|202611250001|202611260001) ;;
            *)
              echo "Unexpected production schema marker; refusing migration."
              exit 1
              ;;
          esac
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202608030003_workbench_drawdown.sql
          workbench_drawdown_columns=$(psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from information_schema.columns where table_schema='public' and table_name='workbench_analyses' and column_name='drawdown_result' and data_type='jsonb' and is_nullable='NO';" | tr -d '[:space:]')
          test "$workbench_drawdown_columns" = 1
          # Apply only the unapplied marker suffix after baseline verification.
          case "$schema_before" in
            202609090002)
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202609100001_reward_lottery_manual_fulfillment.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610080001_admin_custom_trading_display.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610080002_mentor_checkout_recovery.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610080003_mentor_payment_notifications.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610080004_youtube_auto_posts.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100001_admin_payment_hardening.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100002_membership_foundation.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100003_membership_commerce.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100004_membership_benefits.sql
              ;;
            202609100001)
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610080001_admin_custom_trading_display.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610080002_mentor_checkout_recovery.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610080003_mentor_payment_notifications.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610080004_youtube_auto_posts.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100001_admin_payment_hardening.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100002_membership_foundation.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100003_membership_commerce.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100004_membership_benefits.sql
              ;;
            202610080001)
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610080002_mentor_checkout_recovery.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610080003_mentor_payment_notifications.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610080004_youtube_auto_posts.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100001_admin_payment_hardening.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100002_membership_foundation.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100003_membership_commerce.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100004_membership_benefits.sql
              ;;
            202610080002)
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610080003_mentor_payment_notifications.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610080004_youtube_auto_posts.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100001_admin_payment_hardening.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100002_membership_foundation.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100003_membership_commerce.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100004_membership_benefits.sql
              ;;
            202610080003)
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610080004_youtube_auto_posts.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100001_admin_payment_hardening.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100002_membership_foundation.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100003_membership_commerce.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100004_membership_benefits.sql
              ;;
            202610080004)
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100001_admin_payment_hardening.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100002_membership_foundation.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100003_membership_commerce.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100004_membership_benefits.sql
              ;;
            202610100001)
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100002_membership_foundation.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100003_membership_commerce.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100004_membership_benefits.sql
              ;;
            202610100002)
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100003_membership_commerce.sql
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100004_membership_benefits.sql
              ;;
            202610100003)
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100004_membership_benefits.sql
              ;;
            202610100004)
              echo "Existing membership migrations already applied; adding wallet payments."
              ;;
            202610100005)
              echo "Wallet migrations already applied; adding private research."
              ;;
            20261010223739)
              echo "Private research already applied; adding private image input."
              ;;
            20261011001354)
              echo "Private image input already applied; adding explicit YouTube policy consent."
              ;;
            20261011152711)
              echo "YouTube policy consent already applied; adding community engagement."
              ;;
            202610190001)
              echo "Community engagement already applied; adding atomic mentor publishing."
              ;;
            202610220001)
              echo "Atomic mentor publishing already applied; adding service lifecycle."
              ;;
            202610220002)
              echo "Mentor lifecycle applied; adding multi-exchange trade review."
              ;;
            202611240001)
              echo "Multi-exchange trade review applied; adding knowledge-grounded trade review AI."
              ;;
            202611240002)
              echo "Trade review AI applied; adding Discord account linking."
              ;;
            202611250001)
              echo "Discord account linking applied; adding private trade chart state."
              ;;
            202611260001)
              echo "Production migrations already applied; continuing idempotently."
              ;;
            *)
              echo "Unexpected production schema marker; refusing migration."
              exit 1
              ;;
          esac
          if test "$schema_before" != 202610100005 && test "$schema_before" != 20261010223739 && test "$schema_before" != 20261011001354 && test "$schema_before" != 20261011152711 && test "$schema_before" != 202610190001 && test "$schema_before" != 202610220001 && test "$schema_before" != 202610220002 && test "$schema_before" != 202611240001 && test "$schema_before" != 202611240002 && test "$schema_before" != 202611250001 && test "$schema_before" != 202611260001; then
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610100005_membership_wallet_payments.sql
          fi
          if test "$schema_before" != 20261010223739 && test "$schema_before" != 20261011001354 && test "$schema_before" != 202611250001 && test "$schema_before" != 20261011152711 && test "$schema_before" != 202610190001 && test "$schema_before" != 202610220001 && test "$schema_before" != 202610220002 && test "$schema_before" != 202611240001 && test "$schema_before" != 202611240002 && test "$schema_before" != 202611260001; then
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261010223739_hermes_private_research.sql
          fi
          if test "$schema_before" != 20261011001354 && test "$schema_before" != 202611250001 && test "$schema_before" != 20261011152711 && test "$schema_before" != 202610190001 && test "$schema_before" != 202610220001 && test "$schema_before" != 202610220002 && test "$schema_before" != 202611240001 && test "$schema_before" != 202611240002 && test "$schema_before" != 202611260001; then
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261011001354_wave_analysis_images.sql
          fi
          if test "$schema_before" != 20261011152711 && test "$schema_before" != 202611250001 && test "$schema_before" != 202610190001 && test "$schema_before" != 202610220001 && test "$schema_before" != 202610220002 && test "$schema_before" != 202611240001 && test "$schema_before" != 202611240002 && test "$schema_before" != 202611260001; then
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261011152711_youtube_policy_consent.sql
          fi
          if test "$schema_before" != 202610190001 && test "$schema_before" != 202611250001 && test "$schema_before" != 202610220001 && test "$schema_before" != 202610220002 && test "$schema_before" != 202611240001 && test "$schema_before" != 202611240002 && test "$schema_before" != 202611260001; then
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610190001_community_engagement.sql
          fi
          if test "$schema_before" != 202610220001 && test "$schema_before" != 202611250001 && test "$schema_before" != 202610220002 && test "$schema_before" != 202611240001 && test "$schema_before" != 202611240002 && test "$schema_before" != 202611260001; then
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610220001_atomic_admin_mentor_publish.sql
          fi
          if test "$schema_before" != 202610220002 && test "$schema_before" != 202611250001 && test "$schema_before" != 202611240001 && test "$schema_before" != 202611240002 && test "$schema_before" != 202611260001; then
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610220002_mentor_service_lifecycle.sql
          fi
          if test "$schema_before" != 202611240001 && test "$schema_before" != 202611250001 && test "$schema_before" != 202611240002 && test "$schema_before" != 202611260001; then
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202611240001_multi_exchange_trade_review.sql
          fi
          if test "$schema_before" != 202611240002 && test "$schema_before" != 202611250001 && test "$schema_before" != 202611260001; then
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202611240002_trade_review_ai.sql
          fi
          if test "$schema_before" != 202611250001 && test "$schema_before" != 202611260001; then
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202611250001_discord_account_link.sql
          fi
          if test "$schema_before" != 202611260001; then
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202611260001_trade_chart_private.sql
          fi
          schema_after=$(psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c 'select public.wavekb_schema_version();' | tr -d '[:space:]')
          test "$schema_after" = 202611260001
          discord_link_rls=$(psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select c.relrowsecurity and not has_table_privilege('anon','public.discord_link_tokens','SELECT') and not has_table_privilege('authenticated','public.discord_link_tokens','SELECT') from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='discord_link_tokens';" | tr -d '[:space:]')
          test "$discord_link_rls" = t
          discord_link_rpc_closed=$(psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select has_function_privilege('service_role','public.issue_discord_link_token(text,text,text)','EXECUTE') and not has_function_privilege('anon','public.issue_discord_link_token(text,text,text)','EXECUTE') and not has_function_privilege('authenticated','public.issue_discord_link_token(text,text,text)','EXECUTE') and has_function_privilege('authenticated','public.redeem_discord_link_token(text)','EXECUTE') and not has_function_privilege('anon','public.redeem_discord_link_token(text)','EXECUTE');" | tr -d '[:space:]')
          test "$discord_link_rpc_closed" = t
          mentor_publish_rpc_closed=$(psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select has_function_privilege('authenticated','public.admin_upsert_mentor_catalog_v2(uuid,uuid,uuid,text,text,text,text,text[],boolean,integer,text,integer,text,integer,integer,boolean)','EXECUTE') and not has_function_privilege('anon','public.admin_upsert_mentor_catalog_v2(uuid,uuid,uuid,text,text,text,text,text[],boolean,integer,text,integer,text,integer,integer,boolean)','EXECUTE');" | tr -d '[:space:]')
          test "$mentor_publish_rpc_closed" = t
          mentor_service_rpc_closed=$(psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select has_function_privilege('authenticated','public.request_mentor_service_completion(uuid,text)','EXECUTE') and has_function_privilege('authenticated','public.respond_mentor_service_completion(uuid,boolean,text)','EXECUTE') and has_function_privilege('authenticated','public.admin_transition_mentor_service(uuid,text,text,text)','EXECUTE') and not has_function_privilege('anon','public.request_mentor_service_completion(uuid,text)','EXECUTE') and not has_function_privilege('anon','public.respond_mentor_service_completion(uuid,boolean,text)','EXECUTE') and not has_function_privilege('anon','public.admin_transition_mentor_service(uuid,text,text,text)','EXECUTE');" | tr -d '[:space:]')
          test "$mentor_service_rpc_closed" = t
          rls_tables=$(psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('exchange_connections','exchange_connection_secrets','trading_equity_snapshots','trading_return_summaries') and c.relrowsecurity;" | tr -d '[:space:]')
          test "$rls_tables" = 4
