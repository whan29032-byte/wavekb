name: Deploy WaveKB Next.js production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      read_only_acceptance:
        description: "仅在人工确认本次无需真实发帖验收后开启；不跳过构建、只读验收或回滚门槛"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wavekb-next-production
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: https://odmtxwlnlvwldrjttyqu.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_PGarmRpGdqoro6CGEmxsxw_LO0eWVAL
  NEXT_PUBLIC_LEGACY_SITE_URL: https://wavekb.com
  AUTH_GATEWAY_INTERNAL_URL: http://127.0.0.1:8787
  AUTH_GATEWAY_PUBLIC_ORIGIN: https://wavekb.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: next-preview
    steps:
      - name: Check out complete history for comparison with the live release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the release candidate and deployment rollback fixtures
        run: |
          set -Eeuo pipefail
          pnpm test
          pnpm typecheck
          pnpm --filter @wavekb/web lint

      - name: Build the standalone application
        env:
          DEPLOYMENT_VERSION: ${{ github.sha }}
        run: pnpm --filter @wavekb/web build

      - name: Install Chromium for browser acceptance
        run: pnpm --filter @wavekb/web exec playwright install --with-deps chromium

      - name: Verify local critical browser journeys before any production write
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3108
          PORT: 3108
          HOSTNAME: 127.0.0.1
          DEPLOYMENT_VERSION: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          pnpm --filter @wavekb/web start > /tmp/wavekb-candidate-acceptance.log 2>&1 &
          candidate_pid=$!
          trap 'kill "$candidate_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3108/api/health > /dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3108/api/health > /dev/null
          pnpm --filter @wavekb/web exec playwright test e2e/navigation.spec.ts --workers=2
          pnpm --filter @wavekb/web exec playwright test --config=playwright.ui.config.ts

      # No DB credentials or migrations belong in a code deployment. Unknown live
      # SHA/schema fails closed. Gateway changes require separately approved work.
      - name: Read-only schema compatibility and live-base change preflight
        id: preflight
        env:
          READ_ONLY_ACCEPTANCE_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.read_only_acceptance }}
        run: node scripts/deploy-preflight.mjs

      - name: Require the server-only Tline credential before any remote write
        env:
          TLINE_API_KEY: ${{ secrets.TLINE_API_KEY }}
        run: test -n "$TLINE_API_KEY"

      - name: Require credentials when relevant changes need real posting acceptance
        if: steps.preflight.outputs.posting_required == 'true'
        env:
          E2E_POSTING_IDENTIFIER: ${{ secrets.E2E_POSTING_IDENTIFIER }}
          E2E_POSTING_PASSWORD: ${{ secrets.E2E_POSTING_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$E2E_POSTING_IDENTIFIER"
          test -n "$E2E_POSTING_PASSWORD"

      - name: Package the accepted standalone application
        run: tar -C apps/web/.next/standalone --exclude='./apps/web/.next/cache' -czf wavekb-next-preview.tar.gz .

      - name: Configure pinned SSH access
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_FINGERPRINT: SHA256:VDPcrNGSByDvXoaFy8GUJaqSNWS9tfyekTMi8zPXeE8
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 15 -t ed25519 "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null && break
            sleep $((attempt * 2))
          done
          test -s "$HOME/.ssh/known_hosts"
          actual_fingerprint=$(ssh-keygen -lf "$HOME/.ssh/known_hosts" | awk '{print $2}')
          test "$actual_fingerprint" = "$DEPLOY_HOST_FINGERPRINT"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts" "$HOME/.ssh/deploy_key"

      - name: Confirm the actual production service and Nginx target without exposing environment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'set -eu; test "$(sudo -n systemctl show wavekb-next-preview.service -p ActiveState --value)" = active; test "$(sudo -n systemctl show wavekb-next-preview.service -p WorkingDirectory --value)" = /srv/wavekb-next-preview/current; readlink -f /srv/wavekb-next-preview/current'
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'sudo -n /usr/sbin/nginx -T 2>/dev/null' | node scripts/nginx-production-target.mjs

      # First production write: every build/local browser gate already passed.
      # Preview-named root/service ARE production. Existing Nginx/env stay intact.
      - name: Upload immutable production candidate and transaction runner
        id: upload
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ && "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          release_id="${RELEASE_SHA}-${RUN_ID}-${RUN_ATTEMPT}"
          scp -i "$HOME/.ssh/deploy_key" -o BatchMode=yes \
            wavekb-next-preview.tar.gz "${DEPLOY_USER}@${DEPLOY_HOST}:wavekb-next-${release_id}.tar.gz"
          scp -i "$HOME/.ssh/deploy_key" -o BatchMode=yes \
            scripts/deploy-release.mjs "${DEPLOY_USER}@${DEPLOY_HOST}:wavekb-deploy-${release_id}.mjs"

      - name: Activate production with durable exact rollback state
        id: activation
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          BASE_SHA: ${{ steps.preflight.outputs.base_sha }}
          TLINE_API_KEY: ${{ secrets.TLINE_API_KEY }}
        run: |
          set -Eeuo pipefail
          release_id="${RELEASE_SHA}-${RUN_ID}-${RUN_ATTEMPT}"
          printf '%s' "$TLINE_API_KEY" | ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/bin/node ./wavekb-deploy-${release_id}.mjs activate '${RELEASE_SHA}' '${RUN_ID}' '${RUN_ATTEMPT}' '${DEPLOY_USER}' './wavekb-next-${release_id}.tar.gz' '${BASE_SHA}'"

      - name: Verify production version and read-only browser journeys
        env:
          PLAYWRIGHT_BASE_URL: https://wavekb.com
          RELEASE_SHA: ${{ github.sha }}
          KNOWLEDGE_ASSET_CHECK_ORIGIN: https://wavekb.com
        run: |
          set -Eeuo pipefail
          node --input-type=module -e '
            const response = await fetch("https://wavekb.com/api/health", { cache: "no-store", signal: AbortSignal.timeout(15000) });
            const health = await response.json();
            if (!response.ok || health.ok !== true || health.deployment !== process.env.RELEASE_SHA) process.exit(1);
          '
          pnpm --filter @wavekb/web assets:check
          pnpm --filter @wavekb/web exec playwright test e2e/navigation.spec.ts --workers=2

      - name: Verify real Tline research inside the production website without posting
        env:
          PLAYWRIGHT_BASE_URL: https://wavekb.com
          TLINE_LIVE_ACCEPTANCE: "1"
        run: pnpm --filter @wavekb/web exec playwright test e2e/tline.acceptance.spec.ts --workers=1

      # Conditional on relevant changes since LIVE base; this mutates dedicated
      # disposable records and is not a read-only smoke test.
      - name: Run required production posting and authenticated member-shell acceptance
        if: steps.preflight.outputs.posting_required == 'true'
        env:
          E2E_POSTING_IDENTIFIER: ${{ secrets.E2E_POSTING_IDENTIFIER }}
          E2E_POSTING_PASSWORD: ${{ secrets.E2E_POSTING_PASSWORD }}
          PLAYWRIGHT_BASE_URL: https://wavekb.com
        run: |
          pnpm --filter @wavekb/web exec playwright test \
            e2e/member-shell.acceptance.spec.ts e2e/posting.acceptance.spec.ts \
            --project=desktop-chromium --workers=1

      - name: Finalize only the externally accepted release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          release_id="${RELEASE_SHA}-${RUN_ID}-${RUN_ATTEMPT}"
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /usr/bin/node ./wavekb-deploy-${release_id}.mjs finalize '${RELEASE_SHA}' '${RUN_ID}' '${RUN_ATTEMPT}'"

      - name: Restore previous code and service after failed acceptance
        if: (failure() || cancelled()) && steps.upload.outcome == 'success'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          release_id="${RELEASE_SHA}-${RUN_ID}-${RUN_ATTEMPT}"
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /usr/bin/node ./wavekb-deploy-${release_id}.mjs rollback '${RELEASE_SHA}' '${RUN_ID}' '${RUN_ATTEMPT}'"
          # Retain archive, runner and protected backup metadata for investigation.
          # Never print systemd environment or potentially sensitive journal data.
