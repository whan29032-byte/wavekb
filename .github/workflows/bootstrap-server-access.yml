name: Bootstrap production SSH access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-deploy-key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install SSH client helpers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Install the GitHub Actions public key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts" "$HOME/.ssh/deploy_key"
          public_key=$(ssh-keygen -y -f "$HOME/.ssh/deploy_key")
          public_key_b64=$(printf '%s' "$public_key" | base64 -w 0)
          export SSHPASS="$DEPLOY_PASSWORD"
          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "PUBLIC_KEY_B64=${public_key_b64} bash -s" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          public_key=$(printf '%s' "$PUBLIC_KEY_B64" | base64 -d)
          grep -qxF "$public_key" "$HOME/.ssh/authorized_keys" || printf '%s\n' "$public_key" >> "$HOME/.ssh/authorized_keys"
          command -v rsync >/dev/null
          sudo -n true
          REMOTE

      - name: Verify key-only access
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'printf "key access ready\n"; sudo -n true'
