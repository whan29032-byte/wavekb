name: Diagnose WaveKB Next.js production release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Release/config diagnostics; main-only read-only TRON readiness (no orders); or explicitly authorized disposable mentor account audit (no orders/payment writes)"
        required: true
        type: choice
        options: [release, release-state, knowledge-transport, mentor-account, integration-config, tron-readiness]
        default: release
      account_confirmation:
        description: "For mentor-account only, type CREATE_DISPOSABLE_MENTOR_AUDIT_ACCOUNT"
        required: false
        type: string
      release_id:
        description: "Failed immutable release identity (SHA-run-attempt)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: next-preview
    steps:
      - name: Check out diagnostic script
        uses: actions/checkout@v4

      - name: Use pinned Node for the independent public transport diagnostic
        if: inputs.operation == 'knowledge-transport'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use pinned pnpm for disposable asset verification
        if: inputs.operation == 'knowledge-transport'
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install pinned source-verification dependencies only in the disposable test runner
        if: inputs.operation == 'knowledge-transport'
        run: |
          set -Eeuo pipefail
          pnpm install --frozen-lockfile

      - name: Verify the read-only transport probe against actual local fixtures
        if: inputs.operation == 'knowledge-transport'
        run: |
          set -Eeuo pipefail
          node --check scripts/diagnose-knowledge-transport.mjs
          node --test tests/diagnose-knowledge-transport.test.mjs

      - name: Configure pinned SSH access
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_FINGERPRINT: SHA256:VDPcrNGSByDvXoaFy8GUJaqSNWS9tfyekTMi8zPXeE8
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 15 -t ed25519 "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null && break
            sleep $((attempt * 2))
          done
          test -s "$HOME/.ssh/known_hosts"
          actual_fingerprint=$(ssh-keygen -lf "$HOME/.ssh/known_hosts" | awk '{print $2}')
          test "$actual_fingerprint" = "$DEPLOY_HOST_FINGERPRINT"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts" "$HOME/.ssh/deploy_key"

      - name: Read allow-listed retained release state
        if: inputs.operation == 'release'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9a-f]{40}-[1-9][0-9]*-[1-9][0-9]*$ ]]
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/bin/node --input-type=module - '${RELEASE_ID}'" < scripts/diagnose-release.mjs

      - name: Audit with a disposable ordinary mentor buyer account
        if: inputs.operation == 'mentor-account'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ACCOUNT_CONFIRMATION: ${{ inputs.account_confirmation }}
        run: |
          set -Eeuo pipefail
          test "$ACCOUNT_CONFIRMATION" = CREATE_DISPOSABLE_MENTOR_AUDIT_ACCOUNT
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/bin/node --input-type=module - 'gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'" < scripts/mentor-account-audit.mjs

      - name: Read only release transaction and research status without starting services
        if: inputs.operation == 'release-state'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9a-f]{40}-[1-9][0-9]*-[1-9][0-9]*$ ]]
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/bin/node --input-type=module - '${RELEASE_ID}'" < scripts/diagnose-release-state.mjs

      - name: Compare fixed knowledge assets inside the origin without changes
        if: inputs.operation == 'knowledge-transport'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9a-f]{40}-[1-9][0-9]*-[1-9][0-9]*$ ]]
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/bin/node --input-type=module - origin '${RELEASE_ID}'" < scripts/diagnose-knowledge-transport.mjs

      - name: Compare the same fixed assets from the independent public runner
        if: inputs.operation == 'knowledge-transport'
        run: node scripts/diagnose-knowledge-transport.mjs public

      - name: Use pinned Node for the standalone TRON readiness diagnostic
        if: inputs.operation == 'tron-readiness'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the fixed TRON probe with offline fixtures only
        if: inputs.operation == 'tron-readiness'
        run: |
          set -Eeuo pipefail
          node --check scripts/tron-readiness-probe.mjs
          node --test tests/tron-readiness-probe.test.mjs

      - name: Probe the fixed unauthenticated TRON solidified head from the server
        if: inputs.operation == 'tron-readiness'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          tron_state=""
          if tron_state=$(ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/bin/node --input-type=module -" < scripts/tron-readiness-probe.mjs 2>/dev/null); then
            printf '%s\n' "$tron_state" | node scripts/tron-readiness-probe.mjs --project-result
          else
            printf '' | node scripts/tron-readiness-probe.mjs --project-result
          fi

      - name: Read only mail YouTube and wallet configuration presence
        if: inputs.operation == 'integration-config'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/bin/node --input-type=module -" < scripts/integration-config-audit.mjs

      - name: Use pinned Node for safe integration status projection
        if: inputs.operation == 'integration-config'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read only fixed AI worker service state
        if: inputs.operation == 'integration-config'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          service_state=""
          if service_state=$(ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/bin/systemctl show elliott-wave-ai-worker.service --property=LoadState --property=ActiveState --property=SubState" 2>/dev/null); then
            printf '%s\n' "$service_state" | node scripts/integration-config-audit.mjs --worker-state
          else
            printf '' | node scripts/integration-config-audit.mjs --worker-state
          fi
