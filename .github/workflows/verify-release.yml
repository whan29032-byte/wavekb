name: Verify WaveKB release

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated knowledge is current
        run: node scripts/validate-knowledge.mjs

      - name: Verify root and deployment contracts
        run: pnpm test

      - name: Verify knowledge package
        run: pnpm --filter @wavekb/knowledge test

      - name: Verify Gateway
        run: |
          pnpm --dir ai-gateway test
          pnpm --dir ai-gateway typecheck

      - name: Verify Web
        run: |
          pnpm --filter @wavekb/web test
          pnpm --filter @wavekb/web lint
          pnpm --filter @wavekb/web typecheck
          pnpm --filter @wavekb/web build
