packages:
  - apps/*
  - packages/*
  - ai-gateway

# Same-major security patch for the one remaining 5.0.9 resolution.
overrides:
  brace-expansion@5.0.9: 5.0.12

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@storybook/addon-a11y@10.5.8'
  - '@storybook/addon-docs@10.5.8'
  - '@storybook/builder-vite@10.5.8'
  - '@storybook/csf-plugin@10.5.8'
  - '@storybook/nextjs-vite@10.5.8'
  - '@storybook/react-dom-shim@10.5.8'
  - '@storybook/react-vite@10.5.8'
  - '@storybook/react@10.5.8'
  - storybook@10.5.8

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
